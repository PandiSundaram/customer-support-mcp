services:
  mysql:
    image: 'mysql:latest'
    container_name: 'support-agent-mysql'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306:3306'
    volumes:
      - 'mysql-data:/var/lib/mysql'
      - './db/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
        test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pverysecret' ]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 30s

volumes:
  mysql-data:
